<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width="width=device-width, initial scale=1.0">
    <title>Documentación</title>
    <style>
      body {
        font-family: Arial,sans-serif;
        text-align: center;
        background: #21FF81;
        color: #FF00AA;
        transition: background 0,3s;
      }
      button {
        padding: 12px 18px;
        margin: 8px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: #006AFF;
        color: white;  
        font-size: 16px;
      }

      button:hover {
        opacity: 0,8;
      }

      #contador {
        font-size: 50px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1> 🌸🌸🌸 Hifumi~ a tomando el control 🌸🌸🌸</h1>
    <p> 🌸🌸🌸 Hifumi está contenta 🌸🌸🌸</p>

    <h2> Contador de clicks</h2>
    <p id="contador">0</p>
    <button  onclick ="sumar()">¡Sumar!</button>  
    <button onclick="reiniciar()">¡Reiniciar!</button>

    <h2> Aleatorizar colores</h2>
    <button onclick ="cambiarColor()">Cambiar Color</button>  

<script>
  let clicks = 0;
  function sumar(){
  clicks++;
    document.getElementById("contador").textContent = clicks;
  }

  function reiniciar(){
  clicks = 0;
    document.getElementById("contador").textContent = clicks;
  }

function cambiarColor(){
  const colores = [
    "#FF7221",
    "#21FFAA",
    "#AE21FF",
    "#FF00AA",
    "#21FF81"];
  
const color1 = colores[Math.floor(Math.random() * colores.length)];
const color2= colores[Math.floor(Math.random() * colores.length)];
  document.body.style.background = color1;
  document.body.style.color = color2;
}
  
</script>
    
</body>
</html>
